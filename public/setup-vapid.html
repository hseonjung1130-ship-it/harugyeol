<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루결 · 알림 키 만들기</title>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#f8f2e6;color:#473a2e;margin:0;padding:20px}main{max-width:620px;margin:30px auto;background:#fffcf5;border:1px solid #e9dcca;border-radius:18px;padding:25px;box-shadow:0 8px 24px #45351b0d}h1{font-size:24px;margin:0 0 12px}p{line-height:1.7;font-size:14px;color:#755e47}button{background:#926341;color:white;border:0;border-radius:10px;padding:14px 18px;font-weight:700;cursor:pointer;width:100%}label{font-weight:750;display:block;font-size:13px;margin:17px 0 8px}textarea{width:100%;border-radius:10px;padding:10px;border:1px solid #d6c4a8;resize:vertical;min-height:73px;color:#4b3725;font-size:13px;word-break:break-all}section[hidden]{display:none}aside{background:#ffefe1;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;color:#965036}small{color:#8c735a}a{color:#83552c}</style></head>
<body><main><h1>하루결 알림 키 만들기</h1>
<p>아이패드에서도 서버 알림을 설정할 수 있도록 공개키와 비밀키를 <strong>이 브라우저 안에서 직접</strong> 생성해. 이 페이지는 키를 서버로 보내거나 저장하지 않아.</p>
<aside>비밀키는 <strong>본인만</strong> 보관해야 해. GitHub에 올리거나 채팅에 붙여 넣지 마. 페이지를 닫으면 아래 키를 다시 확인할 수 없어.</aside>
<p><button id="generate">새 알림 키 만들기</button></p>
<p id="result" role="status"></p>
<section id="values" hidden>
<label for="public">Netlify 환경 변수: VAPID_PUBLIC_KEY (공개키)</label><textarea id="public" readonly spellcheck="false"></textarea>
<label for="private">Netlify 환경 변수: VAPID_PRIVATE_KEY (비밀키)</label><textarea id="private" readonly spellcheck="false"></textarea>
<label for="subject">Netlify 환경 변수: VAPID_SUBJECT</label><textarea id="subject" readonly spellcheck="false">mailto:your-email@example.com</textarea>
<p><small>위 이메일 주소는 예시이므로 <strong>본인의 이메일 주소로 변경</strong>해서 Netlify에 입력해. 공개키와 비밀키는 반드시 같은 쌍을 사용해야 해.</small></p>
</section>
<p><a href="./index.html">하루결 앱으로 돌아가기</a></p>
</main>
<script>
const enc=bytes=>{let b='';for(const n of new Uint8Array(bytes))b+=String.fromCharCode(n);return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
document.querySelector('#generate').addEventListener('click',async()=>{
 const info=document.querySelector('#result');info.textContent='키를 생성하는 중...';
 try{
  if(!crypto?.subtle)throw Error('HTTPS로 열린 브라우저에서만 생성할 수 있어.');
  const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const jwk=await crypto.subtle.exportKey('jwk',pair.privateKey);
  const pub=await crypto.subtle.exportKey('raw',pair.publicKey);
  document.querySelector('#public').value=enc(pub);
  document.querySelector('#private').value=jwk.d;
  document.querySelector('#values').hidden=false;
  info.textContent='생성이 완료됐어. Netlify의 환경 변수 설정에 복사해 줘.';
 }catch(e){info.textContent='생성 실패: '+e.message}
});
</script></body></html>
